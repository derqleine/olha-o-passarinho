# Development environment: web gallery (PHP), database (MariaDB) and Adminer.
#   docker compose up -d     -> start
#   docker compose down      -> stop
# Passwords: defaults below, or set them in a .env file (see .env.example).

services:
  web:
    build: docker/web
    ports:
      - "8000:80"                # gallery: http://localhost:8000
    volumes:
      - ./web:/var/www/html      # changes in web/ show up immediately
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-olha}
      DB_PASSWORD: ${DB_PASSWORD:-olha}
      DB_NAME: polaroidexpocic
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: polaroidexpocic
      MARIADB_USER: ${DB_USER:-olha}
      MARIADB_PASSWORD: ${DB_PASSWORD:-olha}
    volumes:
      - db-data:/var/lib/mysql
      # Imported automatically on the first run only (empty volume)
      - ./database/polaroidexpocic.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    ports:
      - "8080:8080"              # database admin: http://localhost:8080 (server: db)
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db-data:
